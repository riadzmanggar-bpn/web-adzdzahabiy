<!-- ==========================================================
     KALENDER PENDIDIKAN
     RTQ AL IMAM ADZ DZAHABIY
========================================================== -->

<section class="kaldik-section" id="kaldik">

    <div class="kaldik-container">

        <!-- ==================================================
             HEADER
        ================================================== -->

        <div class="kaldik-header">

            <div class="kaldik-heading">

                <span class="kaldik-label">
                    KALENDER PENDIDIKAN
                </span>

                <h2>
                    Kaldik RTQ
                </h2>

                <p>
                    Kalender Akademik
                    1447–1448 H
                </p>

            </div>


            <!-- ==================================================
                 NAVIGASI BULAN
            ================================================== -->

            <div class="kaldik-navigation">

                <button
                    type="button"
                    class="kaldik-nav-btn"
                    id="kaldik-prev"
                    aria-label="Bulan sebelumnya">

                    &#10094;

                </button>


                <div class="kaldik-current-month">

                    <strong id="kaldik-month-name">
                        Syawal
                    </strong>

                    <span id="kaldik-month-year">
                        1447 H
                    </span>

                </div>


                <button
                    type="button"
                    class="kaldik-nav-btn"
                    id="kaldik-next"
                    aria-label="Bulan berikutnya">

                    &#10095;

                </button>

            </div>

        </div>


        <!-- ==================================================
             KALENDER
        ================================================== -->

        <div class="kaldik-card">

            <div class="kaldik-calendar">

                <!-- NAMA HARI -->

                <div class="kaldik-weekdays">

                    <div>Ahad</div>
                    <div>Senin</div>
                    <div>Selasa</div>
                    <div>Rabu</div>
                    <div>Kamis</div>
                    <div>Jumat</div>
                    <div>Sabtu</div>

                </div>


                <!-- TANGGAL DIISI OLEH kaldik.js -->

                <div
                    class="kaldik-days"
                    id="kaldik-days">

                </div>

            </div>


            <!-- ==================================================
                 DETAIL KEGIATAN
            ================================================== -->

            <div
                class="kaldik-event-detail"
                id="kaldik-event-detail">

                <div class="kaldik-event-empty">

                    Pilih tanggal untuk melihat
                    kegiatan.

                </div>

            </div>

        </div>


        <!-- ==================================================
             LEGENDA WARNA
        ================================================== -->

        <div class="kaldik-legend">

            <div class="kaldik-legend-title">
                Keterangan
            </div>


            <div class="kaldik-legend-items">

                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color administrasi">
                    </span>

                    <span>
                        Administrasi
                    </span>

                </div>


                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color kbm">
                    </span>

                    <span>
                        KBM
                    </span>

                </div>


                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color uhab">
                    </span>

                    <span>
                        UHAB
                    </span>

                </div>


                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color ujian">
                    </span>

                    <span>
                        Ujian
                    </span>

                </div>


                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color libur">
                    </span>

                    <span>
                        Libur
                    </span>

                </div>


                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color dauroh">
                    </span>

                    <span>
                        Dauroh
                    </span>

                </div>


                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color classmeeting">
                    </span>

                    <span>
                        Classmeeting
                    </span>

                </div>


                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color rapot">
                    </span>

                    <span>
                        Pembagian Rapot
                    </span>

                </div>


                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color musabaqoh">
                    </span>

                    <span>
                        Musabaqoh
                    </span>

                </div>


                <div class="kaldik-legend-item">

                    <span
                        class="kaldik-color pendaftaran">
                    </span>

                    <span>
                        Pendaftaran
                    </span>

                </div>

            </div>

        </div>

    </div>

</section>
