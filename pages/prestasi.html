
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Halaman Dalam Perbaikan | RTQ Al Imam Adz Dzahabiy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #164e3b;
            --green-dark: #103b2d;
            --gold: #c6a45c;
            --cream: #f8f6ef;
            --text: #34443b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background:
                radial-gradient(
                    circle at top right,
                    rgba(198, 164, 92, 0.12),
                    transparent 35%
                ),
                var(--cream);
        }

        .maintenance-card {
            position: relative;
            width: 100%;
            max-width: 620px;
            padding: 56px 36px 48px;
            text-align: center;
            background: #fffefa;
            border: 1px solid rgba(198, 164, 92, 0.35);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(22, 78, 59, 0.08);
            overflow: hidden;
            animation: fadeIn 0.8s ease both;
        }

        .maintenance-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(
                90deg,
                var(--green),
                var(--gold),
                var(--green)
            );
        }

        .logo-mark {
            width: 84px;
            height: 84px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(198, 164, 92, 0.65);
            border-radius: 50%;
            background: var(--green);
            color: #f3dfaa;
            font-family: 'Amiri', serif;
            font-size: 42px;
            box-shadow: 0 8px 24px rgba(22, 78, 59, 0.15);
        }

        .brand {
            color: var(--green);
            font-size: 13px;
            font-weight: 700;
            line-height: 1.8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .divider {
            width: 54px;
            height: 2px;
            margin: 28px auto;
            background: var(--gold);
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green);
            background: #eef3ee;
            border-radius: 50%;
        }

        .icon svg {
            width: 38px;
            height: 38px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            margin-bottom: 18px;
            color: var(--green);
            font-size: clamp(26px, 5vw, 36px);
            line-height: 1.3;
            font-weight: 700;
        }

        .message {
            max-width: 440px;
            margin: 0 auto;
            font-size: 16px;
            line-height: 1.9;
            color: #58665d;
        }

        .closing {
            margin-top: 28px;
            color: var(--green);
            font-family: 'Amiri', serif;
            font-size: 27px;
            font-weight: 700;
        }

        .arabic {
            display: block;
            margin-top: 8px;
            color: #8c7747;
            font-family: 'Amiri', serif;
            font-size: 23px;
            direction: rtl;
        }

        footer {
            margin-top: 36px;
            padding-top: 22px;
            border-top: 1px solid #e9e5d9;
            color: #899188;
            font-size: 11px;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .maintenance-card {
                padding: 42px 22px 30px;
                border-radius: 16px;
            }

            .logo-mark {
                width: 72px;
                height: 72px;
                font-size: 36px;
            }

            .brand {
                font-size: 11px;
                letter-spacing: 1px;
            }

            .message {
                font-size: 14px;
            }

            .closing {
                font-size: 25px;
            }

            footer {
                margin-top: 28px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="maintenance-card">

        <div class="logo-mark" aria-hidden="true">
            <span>ض</span>
        </div>

        <div class="brand">
            Rumah Tahfizhul Qur'an<br>
            Al Imam Adz Dzahabiy
        </div>

        <div class="divider"></div>

        <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 7v5l3 2"></path>
                <path d="M5 3 3 5"></path>
                <path d="m19 3 2 2"></path>
            </svg>
        </div>

        <h1>Mohon Maaf</h1>

        <p class="message">
            Halaman yang antum kunjungi sedang dalam perbaikan.
            <br>
            Kunjungi kami di lain waktu.
        </p>

        <div class="closing">
            Jazaakumullahu khoiron
        </div>

        <span class="arabic" lang="ar">
            جزاكم الله خيرًا
        </span>

        <footer>
            &copy; <span id="year"></span>
            RTQ Al Imam Adz Dzahabiy
            <br>
            Semoga Allah memberkahi waktu dan usaha kita.
        </footer>

    </main>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>
</body>
</html>
